plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

group = 'com.f16addon'
version = mod_version
base { archivesName = 'enemyforces' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
        }
        server { args '--nogui' }
    }
}

repositories {
    // Superb Warfare / DragonRise jars live in ../mods; they are only needed at runtime,
    // the addon talks to them via cached reflection so it has no compile-time dependency.
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', version
    filesMatching('META-INF/mods.toml') { expand(version: version) }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : 'enemyforces',
            'Implementation-Title'  : 'Enemy Forces Addon',
            'Implementation-Version': version,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
