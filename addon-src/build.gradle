plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

group = 'com.f16addon'
version = mod_version
base { archivesName = 'enemyforces' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
        }
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Server-side AI still talks to Superb Warfare through cached reflection (Sbw.java). The client-only mixins in
    // com.f16addon.mixin (tactical map performance / UI) are compiled against the SBW jar shipped in ../mods.
    // SBW is Kotlin and its jar is already SRG-named, so it is a plain compile-only file dependency; every mixin
    // targeting it uses remap = false and needs no refmap.
    compileOnly files("../mods/superbwarfare-0.8.9.2-mc1.20.1-65d985a64-all.jar")
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', version
    filesMatching('META-INF/mods.toml') { expand(version: version) }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : 'enemyforces',
            'Implementation-Title'  : 'Enemy Forces Addon',
            'Implementation-Version': version,
            'MixinConfigs'          : 'f16addon.mixins.json',
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
